<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LoteVivo · Explore o loteamento</title>
  <meta name="description" content="Explore o loteamento em 3D, escolha seu lote e simule o pagamento.">
  <meta name="theme-color" content="#0b1210">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261024b">
  <link rel="stylesheet" href="css/realista.css?v=20261024b">
</head>
<body class="viewer">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-top" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><path d="M3 7h18M3 17h18M7 3v18M17 3v18"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-6A8 8 0 1 1 21 12z"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><path d="m3 17 5-5 4 4 3-3 6 6"/><path d="M3 5h18v14H3z"/><circle cx="8.5" cy="8.5" r="1.5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></symbol>
  </svg>

  <div id="app">
    <div id="stage3d" class="stage"></div>
    <div id="stage2d" class="stage" hidden></div>
    <div id="stagereal" class="stage rz-view" hidden></div>
    <div id="stagegrade" class="stage pageview" hidden></div>
    <div id="stagetabela" class="stage pageview" hidden></div>

    <header class="topbar">
      <div class="brand glass">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-txt"><h1 id="pName">Carregando…</h1><p id="pSub"></p></div>
      </div>
      <div class="counts glass" id="counts"></div>
      <div class="bar-right">
        <div class="seg glass" role="tablist" aria-label="Visualização">
          <button data-view="3d" class="on" role="tab"><svg><use href="#i-cube"/></svg><span>3D</span></button>
          <button data-view="2d" role="tab"><svg><use href="#i-map"/></svg><span>Mapa</span></button>
          <button data-view="real" role="tab" id="segReal" hidden><svg><use href="#i-photo"/></svg><span>Real</span></button>
          <button data-view="grade" role="tab"><svg><use href="#i-grid"/></svg><span>Grade</span></button>
          <button data-view="tabela" role="tab"><svg><use href="#i-table"/></svg><span>Tabela</span></button>
        </div>
        <button id="btnExplore" class="btn glass"><svg><use href="#i-sliders"/></svg><span>Explorar</span><b id="filterBadge" hidden></b></button>
        <button id="btnValor" class="btn glass icon" title="Mapa de valor (R$ por m²)" aria-pressed="false"><svg><use href="#i-scale"/></svg></button>
        <button id="btnTour" class="btn glass icon only3d" title="Voo automático" aria-pressed="false"><svg><use href="#i-orbit"/></svg></button>
        <button id="btnFull" class="btn glass icon hide-sm" title="Tela cheia"><svg><use href="#i-expand"/></svg></button>
      </div>
    </header>

    <aside id="explore" class="drawer left glass" aria-label="Explorar lotes">
      <div class="drawer-head">
        <h2>Explorar</h2>
        <button class="x" data-close="explore" aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="drawer-body">
        <label class="search"><svg><use href="#i-search"/></svg><input id="fQ" type="search" placeholder="Quadra e lote, ex.: 12-04" autocomplete="off"></label>
        <section><h3>Situação</h3><div class="chips" id="fStatus"></div></section>
        <section><h3>Valor <span id="fPriceLbl" class="muted"></span></h3><div class="range2" id="fPrice"><input type="range"><input type="range"></div></section>
        <section><h3>Área <span id="fAreaLbl" class="muted"></span></h3><div class="range2" id="fArea"><input type="range"><input type="range"></div></section>
        <section id="fTagsWrap"><h3>Características</h3><div class="chips" id="fTags"></div></section>
        <div class="result-line"><span id="fCount"></span><button class="link" id="fClear">Limpar filtros</button></div>
        <section><h3>Quadras</h3><div id="grid" class="qgrid"></div></section>
      </div>
    </aside>

    <aside id="lotPanel" class="drawer right glass" aria-label="Detalhes do lote"></aside>

    <div class="dock glass" id="dock">
      <div class="dock-sun only3d">
        <button class="ic" id="btnPlaySun" title="Ver o dia passar"><svg><use href="#i-play"/></svg></button>
        <svg class="sunico"><use href="#i-sun"/></svg>
        <input type="range" id="hour" min="5" max="20" step="0.05" value="15.5" aria-label="Horário do dia">
        <output id="hourLbl">15:30</output>
      </div>
      <div class="legend" id="legend"></div>
      <div class="dock-views only3d">
        <button class="ic" id="btnHome" title="Visão geral"><svg><use href="#i-home"/></svg></button>
        <button class="ic" id="btnTop" title="Vista de cima"><svg><use href="#i-top"/></svg></button>
      </div>
    </div>

    <div class="realbar glass" id="realbar" hidden>
      <svg><use href="#i-photo"/></svg>
      <span class="rb-a">Terreno real</span>
      <input type="range" id="blend" min="0" max="1" step="0.01" value="0.65" aria-label="Terreno real ou projeto">
      <span class="rb-b">Projeto</span>
    </div>

    <div class="compass glass only3d" id="compass" title="Norte"><i></i><span>N</span></div>
    <div id="tip" class="tip" hidden></div>
    <div id="tray" class="tray glass" hidden></div>

    <div id="intro" class="intro">
      <div class="intro-inner">
        <p class="eyebrow" id="introCity"></p>
        <h2 id="introName"></h2>
        <p class="intro-sub">Escolha seu lote. Veja como ele é, de onde vem o sol e quanto fica por mês.</p>
        <div class="loader"><i></i></div>
      </div>
    </div>
    <div id="nogl" class="nogl" hidden><p>Seu navegador não abriu o 3D. Mostrando o mapa.</p></div>
  </div>

  <div id="simModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="simTitle"></div>
  <div id="cmpModal" class="modal" hidden role="dialog" aria-modal="true"></div>
  <div id="print" class="print-area"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="js/store.js?v=20261024b"></script>
  <script src="js/sim.js?v=20261024b"></script>
  <script src="js/map2d.js?v=20261024b"></script>
  <script src="js/scene3d.js?v=20261024b"></script>
  <script src="js/realista.js?v=20261024b"></script>
  <script src="js/simulator.js?v=20261024b"></script>
  <script src="js/viewer.js?v=20261024b"></script>
</body>
</html>
